[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wearable-eda"
version = "0.2.0"
description = "Wrist EDA and multimodal arousal research with WESAD"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["wearable-common", "numpy", "scipy", "pandas"]

[project.optional-dependencies]
research = ["scikit-learn", "joblib", "threadpoolctl", "xgboost", "lightgbm", "cvxEDA", "cvxopt", "torch", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
